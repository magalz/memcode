name: Private Windows installer lifecycle
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published beta version to install and verify
        required: true
        default: 0.4.0-beta.11
      sha256:
        description: Exact reviewed installer SHA-256
        required: true
        default: c6d81fa8b1223fdced60d5f4dadcefb324f74a97c357a628a602110c83324c6b
permissions:
  contents: read
jobs:
  actual-windows-installation:
    if: github.repository == 'syncable-dev/memcode' && github.event.repository.private == true
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install verification dependencies
        run: npm ci --ignore-scripts
      - name: Download the exact published installer
        env:
          TEST_VERSION: ${{ inputs.version }}
          TEST_SHA256: ${{ inputs.sha256 }}
        shell: pwsh
        run: |
          if ($env:TEST_VERSION -notmatch '^\d+\.\d+\.\d+-beta\.\d+$' -or $env:TEST_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid release identity.' }
          $url = "https://d12b8r6xagt10r.cloudfront.net/releases/memcode/$env:TEST_VERSION/windows-x86_64/MemCode_$($env:TEST_VERSION)_x64-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\memcode-setup.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\memcode-setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TEST_SHA256) { throw 'Installer hash mismatch.' }
      - name: Install, launch, restart, update, uninstall and reinstall
        env:
          TEST_VERSION: ${{ inputs.version }}
          TEST_SHA256: ${{ inputs.sha256 }}
        shell: pwsh
        run: node scripts/windows-installer-acceptance.mjs --version "$env:TEST_VERSION" --sha256 "$env:TEST_SHA256" --installer "$env:RUNNER_TEMP\memcode-setup.exe" --evidence "$env:RUNNER_TEMP\memcode-installer-evidence"
      - name: Retain private installer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-lifecycle
          path: ${{ runner.temp }}/memcode-installer-evidence
          retention-days: 14
